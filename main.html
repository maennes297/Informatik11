<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatik Alwin Thias</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --text: #212529;
            --header: #0d6efd;
            --code-bg: #f0f0f0;
            --border: #dee2e6;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --header: #6ea8fe;
            --code-bg: #2d2d2d;
            --border: #444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
            transition: background 0, color 0.3s;
        }
        h1, h2, h3 {
            color: var(--header);
            border-bottom: 2px solid var(--header);
            padding-bottom: 10px;
        }
        pre {
            background: var(--code-bg);
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            border-left: 4px solid var(--header);
        }
        code {
            font-family: 'Courier New', monospace;
            background: var(--code-bg);
            padding: 2px 5px;
            border-radius: 3px;
        }
        .verzArray {
            background: var(--code-bg);
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .verzArray a {
            color: var(--header);
            text-decoration: none;
        }
        .verzArray a:hover {
            text-decoration: underline;
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--code-bg);
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
        .entry {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        blockquote {
            border-left: 4px solid var(--header);
            padding-left: 15px;
            margin-left: 0;
            color: var(--text);
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <menu>
        <a href="docs.html">Dokumentation</a>
    </menu>
    <button class="theme-toggle" onclick="toggleTheme()">Theme wechseln</button>
    <h1>Informatik</h1>
    Dokumentation, Projektarbeit, usw.

    <h2>Dokumentation</h2>
    <a href="docs.html">Hier</a> finden sich meine Unterrichtsmitschriften, Notizen, etc.

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            html.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
        }
        // Lade letztes Theme
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
        document.querySelector('.theme-toggle').addEventListener('click', () => {
            const theme = document.documentElement.getAttribute('data-theme');
            localStorage.setItem('theme', theme);
        });
    </script>
</body>
